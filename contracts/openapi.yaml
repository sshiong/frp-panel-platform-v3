openapi: 3.1.0
info:
  title: FRP Panel Server API
  version: 1.0.0
  description: Versioned control-plane contract for the independent Server and Client Panels.
servers:
  - url: https://panel.example.invalid
x-websocket:
  - path: /api/v1/ws
    protocol_version: v1
    upgrade_status: 426
    authentication: bearerAuth
    message_types:
      server_to_client: [session_replaced, user_disabled, config_version_changed, force_full_sync, frp_secret_rotated, mapping_deleted, shutdown_frpc]
      client_to_server: [heartbeat, config_apply_started, config_apply_succeeded, config_apply_failed, frpc_status_changed, local_health_changed]
    envelope_required: [message_id, protocol_version, timestamp, type, payload]
    semantics: notifications_only_full_sync_is_authoritative
paths:
  /api/v1/ws:
    get:
      operationId: websocket
      summary: Authenticated Server-to-Client notification WebSocket
      security: [{ bearerAuth: [] }]
      parameters:
        - name: X-FRP-Protocol-Version
          in: header
          required: false
          schema: { type: string, default: v1 }
      responses:
        '101': { description: WebSocket connection established }
        '401': { $ref: '#/components/responses/Problem' }
        '426': { $ref: '#/components/responses/Problem' }
  /api/v1/compatibility:
    get:
      operationId: compatibility
      responses:
        '200':
          description: Server and Client Panel compatibility metadata
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [request_id, server_version, minimum_client_version, latest_client_version, minimum_frpc_version, protocol_version, config_schema_version]
                properties:
                  request_id: { type: string }
                  server_version: { type: string }
                  minimum_client_version: { type: string }
                  latest_client_version: { type: string }
                  minimum_frpc_version: { type: string }
                  protocol_version: { type: string, enum: [v1] }
                  config_schema_version: { type: string, enum: [v1] }
  /api/v1/auth/client-login:
    post:
      operationId: clientLogin
      summary: Create the only active Client Panel session for a user
      parameters:
        - { $ref: '#/components/parameters/ClientPanelVersion' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientLoginRequest'
      responses:
        '200':
          description: Authenticated session and runtime configuration metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401': { $ref: '#/components/responses/Problem' }
        '426': { $ref: '#/components/responses/Problem' }
  /api/v1/auth/admin-login:
    post:
      operationId: adminLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLoginRequest'
      responses:
        '200':
          description: Admin session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '401': { $ref: '#/components/responses/Problem' }
  /api/v1/auth/logout:
    post:
      operationId: logout
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200':
          description: Session revoked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcknowledgedResponse' }
  /api/v1/auth/change-password:
    post:
      operationId: changePassword
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string, format: password }
                new_username: { type: string, minLength: 3, maxLength: 40, description: Required when the initial administrator identity is being completed. }
                new_password: { type: string, format: password, minLength: 12 }
      responses:
        '200':
          description: Password changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcknowledgedResponse' }
  /api/v1/auth/reauth:
    post:
      operationId: issueReauthTicket
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReauthRequest' }
      responses:
        '200':
          description: Short-lived session-bound reauthentication ticket
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReauthResponse' }
        '401': { $ref: '#/components/responses/Problem' }
  /api/v1/auth/reset-frp-credential:
    post:
      operationId: resetOwnFRPCredential
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reauth_ticket]
              properties:
                reauth_ticket: { type: string, minLength: 32 }
      responses:
        '200':
          description: FRP credential rotated; secret is not returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FRPSecretResetResult' }
        '401': { $ref: '#/components/responses/Problem' }
  /api/v1/me:
    get:
      operationId: me
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Current authenticated session, content: { application/json: { schema: { $ref: '#/components/schemas/AuthenticatedSession' } } } }
  /api/v1/dashboard:
    get:
      operationId: dashboard
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Dashboard summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardResponse' }
  /api/v1/mappings:
    get:
      operationId: listMappings
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: User-scoped mappings
          content:
            application/json:
              schema:
                type: object
                required: [request_id, items, config_version, page, page_size, total]
                properties:
                  request_id: { type: string }
                  items: { type: array, items: { $ref: '#/components/schemas/Mapping' } }
                  config_version: { type: integer, format: int64 }
                  page: { type: integer, minimum: 1 }
                  page_size: { type: integer, minimum: 1, maximum: 200 }
                  total: { type: integer, minimum: 0 }
    post:
      operationId: createMapping
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMappingRequest' }
      responses:
        '201':
          description: Mapping created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MappingResponse' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/mappings/{id}:
    put:
      operationId: updateMapping
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMappingRequest' }
      responses:
        '200': { description: Mapping updated, content: { application/json: { schema: { $ref: '#/components/schemas/MappingResponse' } } } }
        '409': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteMapping
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: force
          in: query
          schema: { type: boolean, default: false }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '202':
          description: Mapping deletion queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperationAcceptedResponse' }
  /api/v1/mappings/{id}/toggle:
    post:
      operationId: toggleMapping
      summary: Toggle mapping desired state
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
                expected_config_version: { type: integer, format: int64 }
                expected_revision: { type: integer, format: int64 }
      responses:
        '200':
          description: Desired state updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcknowledgedResponse' }
  /api/v1/config/full:
    get:
      operationId: fullConfig
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Signed full desired configuration
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigSnapshotResponse' }
  /api/v1/domains:
    get:
      operationId: listDomains
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: User-scoped Domain Bindings
          content:
            application/json:
              schema:
                type: object
                required: [request_id, items, page, page_size, total]
                properties:
                  request_id: { type: string }
                  items: { type: array, items: { $ref: '#/components/schemas/Domain' } }
                  page: { type: integer, minimum: 1 }
                  page_size: { type: integer, minimum: 1, maximum: 200 }
                  total: { type: integer, minimum: 0 }
    post:
      operationId: createDomain
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDomainRequest' }
      responses:
        '202':
          description: Domain Binding created in pending state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DomainResponse' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/domains/{id}/dns-action:
    post:
      operationId: resolveDomainDNSConflict
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [adopt, overwrite, cancel, sync] }
      responses:
        '202':
          description: DNS conflict resolution queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DNSActionResponse' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/domains/{id}:
    delete:
      operationId: deleteDomain
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '202':
          description: Domain deletion queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperationAcceptedResponse' }
  /api/v1/operations:
    get:
      operationId: listOperations
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: User-scoped or administrator-scoped Operation records
          content:
            application/json:
              schema:
                type: object
                required: [request_id, items, page, page_size, total]
                properties:
                  request_id: { type: string }
                  items: { type: array, items: { $ref: '#/components/schemas/Operation' } }
                  page: { type: integer, minimum: 1 }
                  page_size: { type: integer, minimum: 1, maximum: 200 }
                  total: { type: integer, minimum: 0 }
  /api/v1/operations/{id}/retry:
    post:
      operationId: retryOperation
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '202':
          description: Operation requeued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperationAcceptedResponse' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/config/signing-key:
    get:
      operationId: signingKey
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Public Ed25519 verification key metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SigningKeyResponse' }
  /api/v1/config/apply-result:
    post:
      operationId: applyResult
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [config_version, status]
              properties:
                config_version: { type: integer, format: int64 }
                status: { type: string, enum: [succeeded, failed] }
                applied_config_hash: { type: string }
                client_panel_version: { type: string }
                frpc_version: { type: string }
                error_code: { type: string }
                error_message: { type: string }
      responses:
        '200':
          description: Apply result accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcknowledgedResponse' }
  /api/v1/session/heartbeat:
    post:
      operationId: sessionHeartbeat
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200':
          description: Session heartbeat accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HeartbeatResponse' }
  /api/v1/cloudflare/status:
    get:
      operationId: cloudflareStatus
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Cloudflare credential and capability state, content: { application/json: { schema: { $ref: '#/components/schemas/CloudflareStatusResponse' } } } }
  /api/v1/cloudflare/token:
    post:
      operationId: saveCloudflareToken
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, reauth_ticket]
              properties:
                token: { type: string, minLength: 20 }
                reauth_ticket: { type: string, minLength: 32 }
      responses:
        '202':
          description: Token verification queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPendingResponse' }
    delete:
      operationId: clearCloudflareToken
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reauth_ticket]
              properties:
                reauth_ticket: { type: string, minLength: 32 }
      responses:
        '200':
          description: Cloudflare credentials retired
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CloudflareTokenClearedResponse' }
  /api/v1/admin/router/status:
    get:
      operationId: routerStatus
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Router snapshot and last-good state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RouterStatusResponse' }
  /api/v1/admin/router/rebuild:
    post:
      operationId: rebuildRouter
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [reauth_ticket], properties: { reauth_ticket: { type: string, minLength: 32 } } }
      responses:
        '202':
          description: Router snapshot rebuild queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PendingMessageResponse' }
  /api/v1/admin/users:
    get:
      operationId: adminListUsers
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: User list
          content:
            application/json:
              schema:
                type: object
                required: [request_id, items, page, page_size, total]
                properties:
                  request_id: { type: string }
                  items: { type: array, items: { $ref: '#/components/schemas/UserRecord' } }
                  page: { type: integer, minimum: 1 }
                  page_size: { type: integer, minimum: 1, maximum: 200 }
                  total: { type: integer, minimum: 0 }
    post:
      operationId: adminCreateUser
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [username, reauth_ticket], properties: { username: { type: string }, reauth_ticket: { type: string, minLength: 32 } } }
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedUserResponse' }
  /api/v1/admin/users/{id}:
    delete:
      operationId: adminDeleteUser
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: force
          in: query
          schema: { type: boolean, default: false }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [reauth_ticket], properties: { reauth_ticket: { type: string, minLength: 32 } } }
      responses:
        '202':
          description: User deletion compensation operation queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ForcedOperationAcceptedResponse' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/admin/users/{id}/status:
    post:
      operationId: adminSetUserStatus
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [status, reauth_ticket], properties: { status: { type: string, enum: [active, disabled] }, reauth_ticket: { type: string, minLength: 32 } } }
      responses:
        '200':
          description: User status updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcknowledgedResponse' }
  /api/v1/admin/users/{id}/reset-password:
    post:
      operationId: adminResetPassword
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [reauth_ticket], properties: { reauth_ticket: { type: string, minLength: 32 } } }
      responses:
        '200':
          description: Temporary password generated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemporaryPasswordResponse' }
  /api/v1/admin/users/{id}/reset-frp-credential:
    post:
      operationId: adminResetFRPCredential
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reauth_ticket]
              properties:
                reauth_ticket: { type: string, minLength: 32 }
      responses:
        '200':
          description: Target user FRP credential rotated; secret is not returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FRPSecretResetResult' }
  /api/v1/admin/operations:
    get:
      operationId: adminOperations
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: All operation records
          content:
            application/json:
              schema:
                type: object
                required: [request_id, items, page, page_size, total]
                properties:
                  request_id: { type: string }
                  items: { type: array, items: { $ref: '#/components/schemas/Operation' } }
                  page: { type: integer, minimum: 1 }
                  page_size: { type: integer, minimum: 1, maximum: 200 }
                  total: { type: integer, minimum: 0 }
  /api/v1/admin/stats:
    get:
      operationId: adminStats
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Server statistics, content: { application/json: { schema: { $ref: '#/components/schemas/AdminStatsResponse' } } } }
  /api/v1/admin/backups:
    post:
      operationId: createBackup
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, reauth_ticket]
              properties:
                password: { type: string, format: password, minLength: 12 }
                reauth_ticket: { type: string, minLength: 32 }
      responses:
        '201':
          description: Encrypted backup created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupCreatedResponse' }
components:
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 128 }
    ClientPanelVersion:
      name: X-FRP-Client-Version
      in: header
      required: true
      description: Stable Client Panel SemVer. Versions below minimum_client_version receive 426.
      schema: { type: string, pattern: '^[0-9]+\.[0-9]+\.[0-9]+$' }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    Problem:
      description: RFC 9457 Problem Details
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    RequestMetadata:
      type: object
      required: [request_id]
      properties:
        request_id: { type: string }
    AcknowledgedResponse:
      type: object
      additionalProperties: false
      required: [request_id, ok]
      properties:
        request_id: { type: string }
        ok: { type: boolean, const: true }
    OperationAcceptedResponse:
      type: object
      additionalProperties: false
      required: [request_id, operation_id, status]
      properties:
        request_id: { type: string }
        operation_id: { type: string, format: uuid }
        status: { type: string, enum: [pending] }
    ForcedOperationAcceptedResponse:
      type: object
      additionalProperties: false
      required: [request_id, operation_id, status, force]
      properties:
        request_id: { type: string }
        operation_id: { type: string, format: uuid }
        status: { type: string, enum: [pending] }
        force: { type: boolean }
    DNSActionResponse:
      type: object
      additionalProperties: false
      required: [request_id, status, action]
      properties:
        request_id: { type: string }
        status: { type: string, enum: [pending] }
        action: { type: string, enum: [adopt, overwrite, cancel, sync] }
    HeartbeatResponse:
      type: object
      additionalProperties: false
      required: [request_id, ok, server_time]
      properties:
        request_id: { type: string }
        ok: { type: boolean, const: true }
        server_time: { type: string, format: date-time }
    TokenPendingResponse:
      type: object
      additionalProperties: false
      required: [request_id, status, message]
      properties:
        request_id: { type: string }
        status: { type: string, enum: [pending] }
        message: { type: string }
    CloudflareTokenClearedResponse:
      type: object
      additionalProperties: false
      required: [request_id, status, message]
      properties:
        request_id: { type: string }
        status: { type: string, enum: [missing] }
        message: { type: string }
    PendingMessageResponse:
      type: object
      additionalProperties: false
      required: [request_id, status, message]
      properties:
        request_id: { type: string }
        status: { type: string, enum: [pending] }
        message: { type: string }
    SigningKeyResponse:
      type: object
      additionalProperties: false
      required: [request_id, algorithm, key_id, public_key]
      properties:
        request_id: { type: string }
        algorithm: { type: string, const: Ed25519 }
        key_id: { type: string }
        public_key: { type: string }
    BackupCreatedResponse:
      type: object
      additionalProperties: false
      required: [request_id, status, file]
      properties:
        request_id: { type: string }
        status: { type: string, enum: [succeeded] }
        file: { type: string, pattern: '^backups/' }
    TemporaryPasswordResponse:
      type: object
      additionalProperties: false
      required: [request_id, initial_password, warning]
      properties:
        request_id: { type: string }
        initial_password: { type: string, format: password }
        warning: { type: string }
    CreatedUserResponse:
      type: object
      additionalProperties: false
      required: [request_id, user, initial_password, warning]
      properties:
        request_id: { type: string }
        user: { $ref: '#/components/schemas/UserRecord' }
        initial_password: { type: string, format: password }
        warning: { type: string }
    AuthenticatedSession:
      type: object
      additionalProperties: false
      required: [request_id, session_id, user_id, username, role, status, generation, channel, must_change_password, must_change_username, expires_at]
      properties:
        request_id: { type: string }
        session_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        username: { type: string }
        role: { type: string, enum: [admin, user] }
        status: { type: string, enum: [active, disabled, deleting, deleted] }
        generation: { type: integer, format: int64 }
        channel: { type: string, enum: [admin_panel, client_panel] }
        must_change_password: { type: boolean }
        must_change_username: { type: boolean }
        expires_at: { type: string, format: date-time }
    MappingResponse:
      allOf:
        - $ref: '#/components/schemas/Mapping'
        - $ref: '#/components/schemas/RequestMetadata'
    DomainResponse:
      allOf:
        - $ref: '#/components/schemas/Domain'
        - $ref: '#/components/schemas/RequestMetadata'
    DashboardResponse:
      allOf:
        - $ref: '#/components/schemas/Dashboard'
        - $ref: '#/components/schemas/RequestMetadata'
    ConfigSnapshotResponse:
      allOf:
        - $ref: '#/components/schemas/ConfigSnapshot'
        - $ref: '#/components/schemas/RequestMetadata'
    CloudflareStatusResponse:
      allOf:
        - $ref: '#/components/schemas/CloudflareStatus'
        - $ref: '#/components/schemas/RequestMetadata'
    RouterStatusResponse:
      allOf:
        - $ref: '#/components/schemas/RouterStatus'
        - $ref: '#/components/schemas/RequestMetadata'
    AdminStatsResponse:
      allOf:
        - $ref: '#/components/schemas/AdminStats'
        - $ref: '#/components/schemas/RequestMetadata'
    ClientLoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 1, maxLength: 80 }
        password: { type: string, format: password, minLength: 12 }
    AdminLoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 1, maxLength: 80 }
        password: { type: string, format: password, minLength: 12 }
    SessionResponse:
      type: object
      required: [request_id, session_expires_at, user]
      properties:
        request_id: { type: string }
        session_expires_at: { type: string, format: date-time }
        csrf_token:
          type: string
          description: Only returned to the Server Panel browser and stored in the CSRF cookie.
        user: { $ref: '#/components/schemas/UserSummary' }
        token:
          type: string
          description: Only returned to the Client Panel backend; never stored by a browser.
        runtime_credential:
          type: string
          description: Only returned to the Client Panel backend and held in memory for FRP authorization.
        server_version: { type: string }
        minimum_client_version: { type: string }
        latest_client_version: { type: string }
        upgrade_required: { type: boolean }
        upgrade_suggested: { type: boolean }
        frp_username: { type: string }
        frp_secret:
          type: string
          description: Per-user FRP plugin credential; only returned to the Client Panel backend and held in memory.
        frps_transport_secret:
          type: string
          description: Deployment-scoped FRPS native token; only returned to the Client Panel backend and written to its 0600 runtime secret file.
    ReauthRequest:
      type: object
      required: [current_password]
      properties:
        current_password: { type: string, format: password }
    ReauthResponse:
      type: object
      required: [request_id, reauth_ticket, expires_at]
      properties:
        request_id: { type: string }
        reauth_ticket: { type: string, minLength: 32 }
        expires_at: { type: string, format: date-time }
    FRPSecretResetResult:
      type: object
      required: [request_id, status, secret_version, session_generation]
      properties:
        request_id: { type: string }
        status: { type: string, enum: [rotated] }
        secret_version: { type: integer, format: int64 }
        session_generation: { type: integer, format: int64 }
    UserSummary:
      type: object
      required: [id, username, role, status, must_change_password, must_change_username]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        role: { type: string, enum: [admin, user] }
        status: { type: string, enum: [active, disabled, deleting, deleted] }
        must_change_password: { type: boolean }
        must_change_username: { type: boolean }
    FRPCredentialStatus:
      type: object
      required: [present, secret_version, status]
      properties:
        present: { type: boolean }
        secret_version: { type: integer, format: int64 }
        rotated_at: { type: string, format: date-time }
        status: { type: string }
    Dashboard:
      type: object
      required: [user, desired_config_version, applied_config_version, observed_client_status, frp_credential, mappings, counts]
      properties:
        user: { $ref: '#/components/schemas/UserSummary' }
        desired_config_version: { type: integer, format: int64 }
        applied_config_version: { type: integer, format: int64 }
        observed_client_status: { type: string }
        frp_credential: { $ref: '#/components/schemas/FRPCredentialStatus' }
        last_heartbeat_at: { type: string, format: date-time }
        last_error_code: { type: string }
        last_error_message: { type: string }
        mappings: { type: array, items: { $ref: '#/components/schemas/Mapping' } }
        counts: { $ref: '#/components/schemas/DashboardCounts' }
    DashboardCounts:
      type: object
      additionalProperties: false
      required: [total_mappings, running, pending, offline, errors]
      properties:
        total_mappings: { type: integer, minimum: 0 }
        running: { type: integer, minimum: 0 }
        pending: { type: integer, minimum: 0 }
        offline: { type: integer, minimum: 0 }
        errors: { type: integer, minimum: 0 }
    AdminStats:
      type: object
      additionalProperties: false
      required: [active_users, mappings, pending, errors, server_uptime_seconds, frps_public_host, frps_public_port]
      properties:
        active_users: { type: integer, minimum: 0 }
        mappings: { type: integer, minimum: 0 }
        pending: { type: integer, minimum: 0 }
        errors: { type: integer, minimum: 0 }
        server_uptime_seconds: { type: integer, minimum: 0 }
        frps_public_host: { type: string }
        frps_public_port: { type: integer, minimum: 1, maximum: 65535 }
    CloudflareStatus:
      type: object
      additionalProperties: false
      required: [configured, status]
      properties:
        configured: { type: boolean }
        status: { type: string }
        token_version: { type: integer, minimum: 1 }
        verified_at: { type: string, format: date-time }
        capabilities: { $ref: '#/components/schemas/CloudflareCapabilities' }
    CloudflareCapabilities:
      type: object
      additionalProperties: true
      properties:
        token_valid: { type: boolean }
        zone_read: { type: boolean }
        dns_read: { type: boolean }
        dns_write: { type: boolean }
        dns_write_checked: { type: boolean }
        missing: { type: array, items: { type: string } }
    UserRecord:
      allOf:
        - $ref: '#/components/schemas/UserSummary'
        - type: object
          required: [created_at, desired_config_version, applied_config_version, active_session_generation, frp_credential]
          properties:
            created_at: { type: string, format: date-time }
            desired_config_version: { type: integer, format: int64 }
            applied_config_version: { type: integer, format: int64 }
            active_session_generation: { type: integer, format: int64 }
            frp_credential: { $ref: '#/components/schemas/FRPCredentialStatus' }
    CreateMappingRequest:
      type: object
      required: [name, proxy_type, local_ip, local_port]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        proxy_type: { type: string, enum: [tcp, udp, http] }
        local_ip: { type: string, maxLength: 255 }
        local_port: { type: integer, minimum: 1, maximum: 65535 }
        remote_port: { type: integer, minimum: 0, maximum: 65535 }
        expected_config_version: { type: integer, format: int64 }
        expected_revision: { type: integer, format: int64 }
    Mapping:
      type: object
      required: [id, user_id, name, proxy_type, local_ip, local_port, remote_port, lifecycle_status, desired_state, observed_state, revision]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        name: { type: string }
        proxy_type: { type: string, enum: [tcp, udp, http] }
        local_ip: { type: string }
        local_port: { type: integer, minimum: 1, maximum: 65535 }
        remote_port: { type: [integer, 'null'], minimum: 0, maximum: 65535 }
        lifecycle_status: { type: string }
        desired_state: { type: string }
        observed_state: { type: string }
        revision: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateDomainRequest:
      type: object
      required: [mapping_id, hostname, https_mode]
      properties:
        mapping_id: { type: string, format: uuid }
        hostname: { type: string, minLength: 1, maxLength: 253 }
        https_mode: { type: string, enum: [auto_certificate, cloudflare_proxy, http_only] }
        http_redirect: { type: boolean, default: false }
        dns_type: { type: string, enum: [A, AAAA, CNAME], default: CNAME }
        dns_content: { type: string, maxLength: 253, description: A/AAAA address or CNAME target; CNAME defaults to the configured FRPS public host }
        dns_ttl: { type: integer, minimum: 60, maximum: 86400, default: 300 }
        expected_config_version: { type: integer, format: int64 }
    Domain:
      type: object
      required: [id, mapping_id, hostname, normalized_domain, https_mode, http_redirect, dns_type, dns_content, dns_ttl, dns_proxied, dns_managed_by_panel, dns_adopted, status, revision]
      properties:
        id: { type: string, format: uuid }
        mapping_id: { type: string, format: uuid }
        hostname: { type: string }
        normalized_domain: { type: string }
        https_mode: { type: string, enum: [auto_certificate, cloudflare_proxy, http_only] }
        http_redirect: { type: boolean }
        dns_type: { type: string, enum: [A, AAAA, CNAME] }
        dns_content: { type: string }
        dns_ttl: { type: integer, minimum: 60, maximum: 86400 }
        dns_proxied: { type: boolean }
        dns_managed_by_panel: { type: boolean }
        dns_adopted: { type: boolean }
        status: { type: string }
        revision: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Operation:
      type: object
      required: [id, resource_type, operation_type, status, phase, step, created_at]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        resource_type: { type: string }
        resource_id: { type: string }
        operation_type: { type: string }
        status: { type: string, enum: [pending, running, succeeded, failed, canceled] }
        phase: { type: string }
        step: { type: string }
        error_code: { type: string }
        error_message: { type: string }
        compensation_status: { type: string }
        external_residue_count: { type: integer, minimum: 0 }
        external_residues:
          type: array
          items:
            type: object
            required: [resource_type, resource_id, provider, identifier, reason, created_at]
            properties:
              resource_type: { type: string }
              resource_id: { type: string }
              provider: { type: string }
              identifier: { type: string }
              reason: { type: string }
              created_at: { type: string, format: date-time }
              resolved_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    RouterStatus:
      type: object
      required: [router_config_version, router_applied_version, snapshot_directory, adapter]
      properties:
        router_config_version: { type: integer, format: int64 }
        router_applied_version: { type: integer, format: int64 }
        last_good_snapshot_version: { type: integer, format: int64 }
        last_good_snapshot_path: { type: string }
        last_good_snapshot_hash: { type: string }
        last_router_apply_error: { type: string }
        snapshot_directory: { type: string }
        adapter: { type: string, enum: [file-last-good] }
    ConfigSnapshot:
      type: object
      required: [schema_version, config_version, session_generation, payload]
      properties:
        schema_version: { type: string }
        config_version: { type: integer, format: int64 }
        user_id: { type: string, format: uuid }
        session_generation: { type: integer, format: int64 }
        issued_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        config_hash: { type: string }
        signing_key_id: { type: string }
        signature: { type: string }
        payload: { type: object, additionalProperties: true }
    Problem:
      type: object
      required: [type, title, status, detail, code, request_id]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string }
        request_id: { type: string }
        upgrade_required: { type: boolean }
        client_version: { type: string }
        minimum_client_version: { type: string }
        latest_client_version: { type: string }
