openapi: 3.1.0
info:
  title: FRP Panel Server API
  version: 1.0.0
  description: Versioned control-plane contract for the independent Server and Client Panels.
servers:
  - url: https://panel.example.invalid
x-websocket:
  - path: /api/v1/ws
    protocol_version: v1
    authentication: bearerAuth
    message_types:
      server_to_client: [session_replaced, user_disabled, config_version_changed, force_full_sync, frp_secret_rotated, mapping_deleted, shutdown_frpc]
      client_to_server: [heartbeat, config_apply_started, config_apply_succeeded, config_apply_failed, frpc_status_changed, local_health_changed]
    envelope_required: [message_id, protocol_version, timestamp, type, payload]
    semantics: notifications_only_full_sync_is_authoritative
paths:
  /api/v1/compatibility:
    get:
      operationId: compatibility
      responses:
        '200':
          description: Server and Client Panel compatibility metadata
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /api/v1/auth/client-login:
    post:
      operationId: clientLogin
      summary: Create the only active Client Panel session for a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientLoginRequest'
      responses:
        '200':
          description: Authenticated session and runtime configuration metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401': { $ref: '#/components/responses/Problem' }
  /api/v1/auth/admin-login:
    post:
      operationId: adminLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLoginRequest'
      responses:
        '200':
          description: Admin session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '401': { $ref: '#/components/responses/Problem' }
  /api/v1/auth/logout:
    post:
      operationId: logout
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Session revoked }
  /api/v1/auth/change-password:
    post:
      operationId: changePassword
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string, format: password }
                new_password: { type: string, format: password, minLength: 12 }
      responses:
        '200': { description: Password changed }
  /api/v1/me:
    get:
      operationId: me
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Current authenticated principal, content: { application/json: { schema: { $ref: '#/components/schemas/UserSummary' } } } }
  /api/v1/dashboard:
    get:
      operationId: dashboard
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Dashboard summary, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
  /api/v1/mappings:
    get:
      operationId: listMappings
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: User-scoped mappings
          content:
            application/json:
              schema:
                type: object
                required: [items, config_version]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Mapping' } }
                  config_version: { type: integer, format: int64 }
    post:
      operationId: createMapping
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMappingRequest' }
      responses:
        '201': { description: Mapping created }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/mappings/{id}:
    put:
      operationId: updateMapping
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMappingRequest' }
      responses:
        '200': { description: Mapping updated, content: { application/json: { schema: { $ref: '#/components/schemas/Mapping' } } } }
        '409': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteMapping
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: force
          in: query
          schema: { type: boolean, default: false }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '202': { description: Mapping deletion queued }
    post:
      operationId: toggleMapping
      summary: Toggle mapping desired state
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
                expected_config_version: { type: integer, format: int64 }
                expected_revision: { type: integer, format: int64 }
      responses:
        '200': { description: Desired state updated }
  /api/v1/config/full:
    get:
      operationId: fullConfig
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Signed full desired configuration
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigSnapshot' }
  /api/v1/domains:
    get:
      operationId: listDomains
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: User-scoped Domain Bindings
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Domain' } }
    post:
      operationId: createDomain
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDomainRequest' }
      responses:
        '202': { description: Domain Binding created in pending state }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/domains/{id}/dns-action:
    post:
      operationId: resolveDomainDNSConflict
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [adopt, overwrite, cancel] }
      responses:
        '202': { description: DNS conflict resolution queued }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/domains/{id}:
    delete:
      operationId: deleteDomain
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '202': { description: Domain deletion queued }
  /api/v1/operations:
    get:
      operationId: listOperations
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: User-scoped or administrator-scoped Operation records
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Operation' } }
  /api/v1/operations/{id}/retry:
    post:
      operationId: retryOperation
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '202': { description: Operation requeued }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/config/signing-key:
    get:
      operationId: signingKey
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Public Ed25519 verification key metadata
          content:
            application/json:
              schema: { type: object, required: [algorithm, key_id, public_key], additionalProperties: false, properties: { algorithm: { type: string }, key_id: { type: string }, public_key: { type: string } } }
  /api/v1/config/apply-result:
    post:
      operationId: applyResult
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [config_version, status]
              properties:
                config_version: { type: integer, format: int64 }
                status: { type: string, enum: [succeeded, failed] }
                applied_config_hash: { type: string }
                client_panel_version: { type: string }
                frpc_version: { type: string }
                error_code: { type: string }
                error_message: { type: string }
      responses:
        '200': { description: Apply result accepted }
  /api/v1/session/heartbeat:
    post:
      operationId: sessionHeartbeat
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Session heartbeat accepted }
  /api/v1/cloudflare/status:
    get:
      operationId: cloudflareStatus
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Cloudflare credential and capability state, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
  /api/v1/cloudflare/token:
    post:
      operationId: saveCloudflareToken
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [token], properties: { token: { type: string, minLength: 20 } } }
      responses:
        '202': { description: Token verification queued }
    delete:
      operationId: clearCloudflareToken
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Cloudflare credentials retired }
  /api/v1/admin/router/status:
    get:
      operationId: routerStatus
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Router snapshot and last-good state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RouterStatus' }
  /api/v1/admin/router/rebuild:
    post:
      operationId: rebuildRouter
      security: [{ bearerAuth: [] }]
      responses:
        '202': { description: Router snapshot rebuild queued }
  /api/v1/admin/users:
    get:
      operationId: adminListUsers
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: User list, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
    post:
      operationId: adminCreateUser
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [username], properties: { username: { type: string }, password: { type: string, format: password } } }
      responses:
        '201': { description: User created }
  /api/v1/admin/users/{id}:
    delete:
      operationId: adminDeleteUser
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: force
          in: query
          schema: { type: boolean, default: false }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '202': { description: User deletion compensation operation queued }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/admin/users/{id}/status:
    post:
      operationId: adminSetUserStatus
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [status], properties: { status: { type: string, enum: [active, disabled] } } }
      responses:
        '200': { description: User status updated }
  /api/v1/admin/users/{id}/reset-password:
    post:
      operationId: adminResetPassword
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Temporary password generated }
  /api/v1/admin/operations:
    get:
      operationId: adminOperations
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: All operation records, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
  /api/v1/admin/stats:
    get:
      operationId: adminStats
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Server statistics, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
  /api/v1/admin/backups:
    post:
      operationId: createBackup
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, format: password, minLength: 12 }
      responses:
        '201': { description: Encrypted backup created }
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 128 }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    Problem:
      description: RFC 9457 Problem Details
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    ClientLoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 1, maxLength: 80 }
        password: { type: string, format: password, minLength: 12 }
    AdminLoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 1, maxLength: 80 }
        password: { type: string, format: password, minLength: 12 }
    SessionResponse:
      type: object
      required: [request_id, session_expires_at, user]
      properties:
        request_id: { type: string }
        session_expires_at: { type: string, format: date-time }
        user: { $ref: '#/components/schemas/UserSummary' }
        token:
          type: string
          description: Only returned to the Client Panel backend; never stored by a browser.
        runtime_credential:
          type: string
          description: Only returned to the Client Panel backend and held in memory for FRP authorization.
        frp_username: { type: string }
        frp_secret:
          type: string
          description: Only returned to the Client Panel backend; never persisted by the Client Panel.
    UserSummary:
      type: object
      required: [id, username, role, status, must_change_password]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        role: { type: string, enum: [admin, user] }
        status: { type: string, enum: [active, disabled, deleting, deleted] }
        must_change_password: { type: boolean }
    CreateMappingRequest:
      type: object
      required: [name, proxy_type, local_ip, local_port]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        proxy_type: { type: string, enum: [tcp, udp, http] }
        local_ip: { type: string, maxLength: 255 }
        local_port: { type: integer, minimum: 1, maximum: 65535 }
        remote_port: { type: integer, minimum: 0, maximum: 65535 }
        expected_config_version: { type: integer, format: int64 }
        expected_revision: { type: integer, format: int64 }
    Mapping:
      allOf:
        - $ref: '#/components/schemas/CreateMappingRequest'
        - type: object
          required: [id, user_id, lifecycle_status, desired_state, observed_state, revision]
          properties:
            id: { type: string, format: uuid }
            user_id: { type: string, format: uuid }
            lifecycle_status: { type: string }
            desired_state: { type: string }
            observed_state: { type: string }
            revision: { type: integer, format: int64 }
    CreateDomainRequest:
      type: object
      required: [mapping_id, hostname, https_mode]
      properties:
        mapping_id: { type: string, format: uuid }
        hostname: { type: string, minLength: 1, maxLength: 253 }
        https_mode: { type: string, enum: [auto_certificate, cloudflare_proxy, http_only] }
        http_redirect: { type: boolean, default: false }
        dns_type: { type: string, enum: [A, AAAA, CNAME], default: CNAME }
        dns_content: { type: string, maxLength: 253, description: A/AAAA address or CNAME target; CNAME defaults to the configured FRPS public host }
        dns_ttl: { type: integer, minimum: 60, maximum: 86400, default: 300 }
        expected_config_version: { type: integer, format: int64 }
    Domain:
      allOf:
        - $ref: '#/components/schemas/CreateDomainRequest'
        - type: object
          required: [id, normalized_domain, status, revision]
          properties:
            id: { type: string, format: uuid }
            normalized_domain: { type: string }
            dns_proxied: { type: boolean }
            status: { type: string }
            revision: { type: integer, format: int64 }
    Operation:
      type: object
      required: [id, resource_type, operation_type, status, phase, step]
      properties:
        id: { type: string, format: uuid }
        resource_type: { type: string }
        resource_id: { type: string }
        operation_type: { type: string }
        status: { type: string, enum: [pending, running, succeeded, failed, canceled] }
        phase: { type: string }
        step: { type: string }
        error_code: { type: string }
        error_message: { type: string }
        compensation_status: { type: string }
        external_residue_count: { type: integer, minimum: 0 }
        external_residues:
          type: array
          items:
            type: object
            required: [resource_type, resource_id, provider, identifier, reason, created_at]
            properties:
              resource_type: { type: string }
              resource_id: { type: string }
              provider: { type: string }
              identifier: { type: string }
              reason: { type: string }
              created_at: { type: string, format: date-time }
              resolved_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    RouterStatus:
      type: object
      required: [router_config_version, router_applied_version, snapshot_directory, adapter]
      properties:
        router_config_version: { type: integer, format: int64 }
        router_applied_version: { type: integer, format: int64 }
        last_good_snapshot_version: { type: integer, format: int64 }
        last_good_snapshot_path: { type: string }
        last_good_snapshot_hash: { type: string }
        last_router_apply_error: { type: string }
        snapshot_directory: { type: string }
        adapter: { type: string, enum: [file-last-good] }
    ConfigSnapshot:
      type: object
      required: [schema_version, config_version, session_generation, payload]
      properties:
        schema_version: { type: string }
        config_version: { type: integer, format: int64 }
        session_generation: { type: integer, format: int64 }
        payload: { type: object, additionalProperties: true }
    Problem:
      type: object
      required: [type, title, status, detail, code, request_id]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string }
        request_id: { type: string }
