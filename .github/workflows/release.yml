name: release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'SemVer tag for the GitHub release, for example v1.2.3'
        required: true
        type: string
      server_version:
        description: 'Independent Server Panel SemVer'
        required: true
        type: string
      client_version:
        description: 'Independent Client Panel SemVer'
        required: true
        type: string
      minimum_client_version:
        description: 'Oldest supported Client Panel SemVer'
        required: false
        default: '0.1.0'
        type: string
      minimum_frpc_version:
        description: 'Oldest supported FRPC SemVer'
        required: false
        default: '0.68.0'
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: |
            server/go.sum
            client/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Resolve independent release versions
        id: release-version
        shell: bash
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          INPUT_SERVER_VERSION: ${{ inputs.server_version }}
          INPUT_CLIENT_VERSION: ${{ inputs.client_version }}
          INPUT_MINIMUM_CLIENT_VERSION: ${{ inputs.minimum_client_version }}
          INPUT_MINIMUM_FRPC_VERSION: ${{ inputs.minimum_frpc_version }}
        run: |
          set -euo pipefail
          if [[ -n "$INPUT_RELEASE_TAG" ]]; then
            release_tag="$INPUT_RELEASE_TAG"
            server_version="$INPUT_SERVER_VERSION"
            client_version="$INPUT_CLIENT_VERSION"
          else
            release_tag="$GITHUB_REF_NAME"
            server_version="${release_tag#v}"
            client_version="${release_tag#v}"
          fi
          minimum_client_version="${INPUT_MINIMUM_CLIENT_VERSION:-0.1.0}"
          minimum_frpc_version="${INPUT_MINIMUM_FRPC_VERSION:-0.68.0}"
          [[ "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "release tag must be vMAJOR.MINOR.PATCH" >&2; exit 1; }
          [[ -n "$server_version" && -n "$client_version" ]] || { echo "independent Server/Client versions are required" >&2; exit 1; }
          {
            echo "tag=$release_tag"
            echo "server_version=$server_version"
            echo "client_version=$client_version"
            echo "minimum_client_version=$minimum_client_version"
            echo "minimum_frpc_version=$minimum_frpc_version"
          } >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm ci
        working-directory: web/admin
      - run: npm ci
        working-directory: web/client
      - name: Download fixed FRP dependency
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="frp_0.68.0_linux_amd64.tar.gz"
          url="https://github.com/fatedier/frp/releases/download/v0.68.0/${archive}"
          curl --fail --location --silent --show-error "$url" -o "/tmp/${archive}"
          digest="$(gh api repos/fatedier/frp/releases/tags/v0.68.0 --jq ".assets[] | select(.name == \"${archive}\") | .digest")"
          test -n "$digest" && test "${digest#sha256:}" != "$digest"
          printf '%s  %s\n' "${digest#sha256:}" "/tmp/${archive}" | sha256sum --check --status
          mv "/tmp/${archive}" /tmp/frp.tgz
          tar -xzf /tmp/frp.tgz -C /tmp
          mkdir -p build
          cp /tmp/frp_0.68.0_linux_amd64/frps build/frps
          cp /tmp/frp_0.68.0_linux_amd64/frpc build/frpc
      - run: SERVER_VERSION="${{ steps.release-version.outputs.server_version }}" CLIENT_VERSION="${{ steps.release-version.outputs.client_version }}" MINIMUM_CLIENT_VERSION="${{ steps.release-version.outputs.minimum_client_version }}" LATEST_CLIENT_VERSION="${{ steps.release-version.outputs.client_version }}" MINIMUM_FRPC_VERSION="${{ steps.release-version.outputs.minimum_frpc_version }}" FRPS_BINARY=build/frps FRPC_BINARY=build/frpc FRPS_VERSION=0.68.0 FRPC_VERSION=0.68.0 make contract migration-check license build sbom checksums manifest
      - name: Enforce external acceptance before release
        env:
          EXTERNAL_ACCEPTANCE_EVIDENCE: release-evidence.json
          EXTERNAL_ACCEPTANCE_LOCAL: '1'
          FRP_E2E_FRPS_BINARY: ${{ github.workspace }}/build/frps
          FRP_E2E_FRPS_CONFIG: ${{ github.workspace }}/tests/fixtures/frp/network/frps.toml
          FRP_E2E_FRPC_BINARY: ${{ github.workspace }}/build/frpc
          FRP_E2E_FRPC_CONFIG: ${{ github.workspace }}/tests/fixtures/frp/network/frpc.toml
          FRP_E2E_URL: http://127.0.0.1:17080/
          FRP_E2E_FRPS_READY_HOST: 127.0.0.1
          FRP_E2E_FRPS_READY_PORT: '17000'
          FRP_E2E_WAIT_SECONDS: '30'
          FRPC_VERIFY_BINARY: ${{ github.workspace }}/build/frpc
          FRPC_VERIFY_VERSION: 0.68.0
        run: |
          set -euo pipefail
          export FRP_E2E_FRPS_SHA256="$(sha256sum "$FRP_E2E_FRPS_BINARY" | awk '{print $1}')"
          export FRP_E2E_FRPC_SHA256="$(sha256sum "$FRP_E2E_FRPC_BINARY" | awk '{print $1}')"
          python3 -m http.server 17081 --directory tests/fixtures/frp/network >/tmp/frp-panel-release-fixture.log 2>&1 &
          fixture_pid=$!
          cleanup() {
            kill "$fixture_pid" 2>/dev/null || true
            wait "$fixture_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          make external-acceptance
      - uses: sigstore/cosign-installer@v3
      - name: Sign release metadata and binaries
        run: |
          set -euo pipefail
          for artifact in build/frp-panel-server build/frp-panel-client build/frps build/frpc build/SHA256SUMS build/sbom.spdx.json build/release-manifest.json; do
            cosign sign-blob --yes --output-signature "${artifact}.sig" --output-certificate "${artifact}.pem" "${artifact}"
          done
      - name: Verify keyless signatures and workflow identity
        run: |
          set -euo pipefail
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}"
          issuer="https://token.actions.githubusercontent.com"
          for artifact in build/frp-panel-server build/frp-panel-client build/frps build/frpc build/SHA256SUMS build/sbom.spdx.json build/release-manifest.json; do
            test -s "${artifact}.sig"
            test -s "${artifact}.pem"
            cosign verify-blob \
              --signature "${artifact}.sig" \
              --certificate "${artifact}.pem" \
              --certificate-identity "${identity}" \
              --certificate-oidc-issuer "${issuer}" \
              "${artifact}"
          done
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            build/frp-panel-server
            build/frp-panel-client
            build/frps
            build/frpc
            build/SHA256SUMS
            build/sbom.spdx.json
            build/release-manifest.json
            build/*.sig
            build/*.pem
