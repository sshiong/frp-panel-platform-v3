name: external-acceptance

on:
  workflow_dispatch:
    inputs:
      zone_id:
        description: "Disposable Cloudflare Sandbox zone ID"
        required: true
        type: string
      expected_zone_name:
        description: "Expected zone name; leave empty only if the operator has separately verified it"
        required: false
        type: string
      record_name:
        description: "Fresh disposable A-record name under the selected zone"
        required: true
        type: string
      acme_domain:
        description: "Fresh DNS name for the ACME Staging DNS-01 order"
        required: true
        type: string
      acme_directory_url:
        description: "ACME Staging directory URL"
        required: false
        default: "https://acme-staging-v02.api.letsencrypt.org/directory"
        type: string

concurrency:
  group: external-acceptance-${{ inputs.zone_id }}-${{ inputs.acme_domain }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sandbox-and-acme:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: external-acceptance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: server/go.sum
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Prepare redacted runner output directory
        run: mkdir -p output/external-runners
      - name: Run Cloudflare disposable-zone smoke
        id: cloudflare
        continue-on-error: true
        env:
          CLOUDFLARE_E2E_API_TOKEN: ${{ secrets.CLOUDFLARE_E2E_API_TOKEN }}
          CLOUDFLARE_E2E_ZONE_ID: ${{ inputs.zone_id }}
          CLOUDFLARE_E2E_EXPECTED_ZONE_NAME: ${{ inputs.expected_zone_name }}
          CLOUDFLARE_E2E_RECORD_NAME: ${{ inputs.record_name }}
          CLOUDFLARE_E2E_CONFIRM: disposable-zone
        run: |
          set +e
          make cloudflare-e2e > output/external-runners/cloudflare-sandbox-e2e.json 2>&1
          status=$?
          set -e
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Run ACME Staging DNS-01 smoke
        id: acme
        continue-on-error: true
        env:
          CLOUDFLARE_E2E_API_TOKEN: ${{ secrets.CLOUDFLARE_E2E_API_TOKEN }}
          CLOUDFLARE_API_BASE_URL: https://api.cloudflare.com/client/v4
          FRP_ACME_E2E_DIRECTORY_URL: ${{ inputs.acme_directory_url }}
          FRP_ACME_E2E_EMAIL: ${{ secrets.FRP_ACME_E2E_EMAIL }}
          FRP_ACME_E2E_DOMAIN: ${{ inputs.acme_domain }}
          FRP_ACME_E2E_CONFIRM: acme-staging
        run: |
          set +e
          make acme-e2e > output/external-runners/acme-staging-e2e.json 2>&1
          status=$?
          set -e
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Upload redacted runner evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-acceptance-${{ github.run_id }}
          path: output/external-runners/
          if-no-files-found: error
          retention-days: 14
      - name: Require both external smoke runners to pass
        if: always()
        env:
          CLOUDFLARE_EXIT: ${{ steps.cloudflare.outputs.exit_code }}
          ACME_EXIT: ${{ steps.acme.outputs.exit_code }}
        run: |
          test "$CLOUDFLARE_EXIT" = 0
          test "$ACME_EXIT" = 0
