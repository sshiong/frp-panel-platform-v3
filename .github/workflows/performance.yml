name: performance

on:
  workflow_dispatch:

jobs:
  baseline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: |
            server/go.sum
            client/go.sum
      - name: Run target-scale performance profile
        run: make perf 2>&1 | tee performance.log
        env:
          FRP_PERF: '1'
          FRP_PERF_SCALE: '1'
      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-target-scale-performance
          path: performance.log
          if-no-files-found: error

  fixed-2vcpu-2g:
    name: fixed Linux 2 vCPU / 2 GiB profile
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Run resource-constrained SQLite WAL profile
        run: |
          set -euo pipefail
          docker run --rm \
            --cpus=2 \
            --memory=2g \
            --memory-swap=2g \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/workspace" \
            --workdir /workspace \
            golang:1.25-bookworm \
            bash -lc '
              set -euo pipefail
              export FRP_PERF=1 FRP_PERF_SCALE=1
              export GOCACHE=/tmp/frp-go-build GOMODCACHE=/tmp/frp-go-mod
              {
                cd /workspace/server
                go test -v -run "^TestPerformance(Baseline|Scale|SessionReplacement)$" -count=1 ./internal/httpapi
                cd /workspace/client
                go test -v -run "^TestPerformanceConfigSubmitToClientApply$" -count=1 ./internal/app
              } 2>&1 | tee /workspace/performance-fixed-2vcpu-2g.log
            '
      - name: Upload fixed resource performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-fixed-2vcpu-2g-performance
          path: performance-fixed-2vcpu-2g.log
          if-no-files-found: error
