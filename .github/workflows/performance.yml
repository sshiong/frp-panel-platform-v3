name: performance

on:
  workflow_dispatch:

jobs:
  baseline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: |
            server/go.sum
            client/go.sum
      - name: Run target-scale performance profile
        run: make perf 2>&1 | tee performance.log
        env:
          FRP_PERF: '1'
          FRP_PERF_SCALE: '1'
      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-target-scale-performance
          path: performance.log
          if-no-files-found: error
