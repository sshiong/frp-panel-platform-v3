name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [server, client]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - run: go test -race ./...
        working-directory: ${{ matrix.module }}
      - run: go vet ./...
        working-directory: ${{ matrix.module }}
      - run: go install honnef.co/go/tools/cmd/staticcheck@latest
      - run: staticcheck ./...
        working-directory: ${{ matrix.module }}
      - run: ./scripts/check-format.sh
        if: matrix.module == 'server'

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run generate:contracts
      - run: git diff --exit-code -- contracts/generated/server-api.d.ts contracts/generated/client-api.d.ts
      - run: ruby scripts/validate-openapi.rb
      - run: ruby -c scripts/external-acceptance.rb
      - run: ruby scripts/test-external-acceptance.rb
      - run: ruby scripts/release-workflow-policy.rb
      - run: go test ./internal/httpapi -run '^TestHTTPContract' -count=1
        working-directory: server
      - run: go test ./internal/db -run '^TestMigration' -count=1
        working-directory: server
      - run: ruby scripts/license-policy.rb
      - run: ruby scripts/css-token-policy.rb

  web:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [admin, client]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: web/${{ matrix.app }}/package-lock.json
      - run: npm ci
        working-directory: web/${{ matrix.app }}
      - run: npm run typecheck
        working-directory: web/${{ matrix.app }}
      - run: npm run lint
        working-directory: web/${{ matrix.app }}
      - run: npm run test:policy
        working-directory: web/${{ matrix.app }}
      - run: npm run build
        working-directory: web/${{ matrix.app }}
      - name: Install accessibility tooling
        if: matrix.app == 'admin'
        run: npm ci
      - name: Install Chromium for accessibility audit
        if: matrix.app == 'admin'
        run: npx playwright install --with-deps chromium
      - name: Build Client for accessibility audit
        if: matrix.app == 'admin'
        run: |
          npm ci
          npm run build
        working-directory: web/client
      - name: Run WCAG accessibility audit
        if: matrix.app == 'admin'
        run: npm run test:accessibility

  frp-linux-e2e:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: server/go.sum
      - name: Download and verify fixed FRP v0.68.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive="frp_0.68.0_linux_amd64.tar.gz"
          url="https://github.com/fatedier/frp/releases/download/v0.68.0/${archive}"
          curl --fail --location --silent --show-error "$url" -o "/tmp/${archive}"
          digest="$(gh api repos/fatedier/frp/releases/tags/v0.68.0 --jq ".assets[] | select(.name == \"${archive}\") | .digest")"
          test -n "$digest" && test "${digest#sha256:}" != "$digest"
          printf '%s  %s\n' "${digest#sha256:}" "/tmp/${archive}" | sha256sum --check --status
          rm -rf /tmp/frp_0.68.0_linux_amd64
          tar -xzf "/tmp/${archive}" -C /tmp
          install -Dm755 /tmp/frp_0.68.0_linux_amd64/frps build/frps
          install -Dm755 /tmp/frp_0.68.0_linux_amd64/frpc build/frpc
          ./build/frps --version
          ./build/frpc --version
      - name: Verify fixed FRP configuration
        run: |
          set -euo pipefail
          ./build/frps verify -c tests/fixtures/frp/network/frps.toml
          ./build/frpc verify -c tests/fixtures/frp/network/frpc.toml
      - name: Run native FRPS/FRPC TCP E2E
        run: |
          set -euo pipefail
          python3 -m http.server 17081 --directory tests/fixtures/frp/network >/tmp/frp-panel-ci-fixture.log 2>&1 &
          fixture_pid=$!
          cleanup() {
            kill "$fixture_pid" 2>/dev/null || true
            wait "$fixture_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          FRP_E2E_FRPS_BINARY="$GITHUB_WORKSPACE/build/frps" \
          FRP_E2E_FRPS_CONFIG="$GITHUB_WORKSPACE/tests/fixtures/frp/network/frps.toml" \
          FRP_E2E_FRPC_BINARY="$GITHUB_WORKSPACE/build/frpc" \
          FRP_E2E_FRPC_CONFIG="$GITHUB_WORKSPACE/tests/fixtures/frp/network/frpc.toml" \
          FRP_E2E_URL=http://127.0.0.1:17080/ \
          FRP_E2E_FRPS_READY_HOST=127.0.0.1 \
          FRP_E2E_FRPS_READY_PORT=17000 \
          make network-e2e
      - name: Run real FRPS Plugin network E2E
        env:
          FRP_E2E_FRPS_BINARY: ${{ github.workspace }}/build/frps
          FRP_E2E_FRPC_BINARY: ${{ github.workspace }}/build/frpc
        run: make plugin-e2e

  fault-injection:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: server/go.sum
      - name: Run disposable Linux fault injection
        run: make fault-injection

  release-metadata:
    runs-on: ubuntu-latest
    needs: [go, web, frp-linux-e2e, fault-injection]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - run: ruby scripts/validate-openapi.rb
      - run: ruby scripts/generate-sbom.rb

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: ruby scripts/secret-scan.rb
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
        working-directory: server
      - run: govulncheck ./...
        working-directory: client
      - run: go install github.com/securego/gosec/v2/cmd/gosec@latest
      - run: gosec -fmt sarif -out gosec-server.sarif ./...
        working-directory: server
      - run: gosec -fmt sarif -out gosec-client.sarif ./...
        working-directory: client
      - name: Upload server gosec report
        if: ${{ always() && hashFiles('server/gosec-server.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: server/gosec-server.sarif
          category: gosec-server
      - name: Upload client gosec report
        if: ${{ always() && hashFiles('client/gosec-client.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: client/gosec-client.sarif
          category: gosec-client
      - run: npm ci
        working-directory: web/admin
      - run: npm audit --audit-level=high
        working-directory: web/admin
      - run: npm ci
        working-directory: web/client
      - run: npm audit --audit-level=high
        working-directory: web/client
      - name: Filesystem dependency and secret scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

  container-scan:
    runs-on: ubuntu-latest
    needs: [go, web]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Build Server image
        run: docker build --file docker/server.Dockerfile --tag frp-panel-server:ci .
      - name: Build Client image
        run: docker build --file docker/client.Dockerfile --tag frp-panel-client:ci .
      - name: Scan Server image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: frp-panel-server:ci
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Scan Client image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: frp-panel-client:ci
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - run: go test -run=^$ -fuzz=FuzzNormalizeDomain -fuzztime=30s ./internal/service
        working-directory: server
      - run: go test -run=^$ -fuzz=FuzzSnapshotRoundTrip -fuzztime=30s ./internal/router
        working-directory: server
      - run: go test -run=^$ -fuzz=FuzzNormalizeServerURL -fuzztime=30s ./internal/security
        working-directory: client
