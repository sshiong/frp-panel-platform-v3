name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [server, client]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - run: go test -race ./...
        working-directory: ${{ matrix.module }}
      - run: go vet ./...
        working-directory: ${{ matrix.module }}
      - run: go install honnef.co/go/tools/cmd/staticcheck@latest
      - run: staticcheck ./...
        working-directory: ${{ matrix.module }}
      - run: ./scripts/check-format.sh
        if: matrix.module == 'server'

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: server/go.sum
      - run: ruby scripts/validate-openapi.rb
      - run: go test ./internal/httpapi -run '^TestHTTPContract' -count=1
        working-directory: server
      - run: go test ./internal/db -run '^TestMigration' -count=1
        working-directory: server
      - run: ruby scripts/license-policy.rb

  web:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [admin, client]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: web/${{ matrix.app }}/package-lock.json
      - run: npm ci
        working-directory: web/${{ matrix.app }}
      - run: npm run typecheck
        working-directory: web/${{ matrix.app }}
      - run: npm run lint
        working-directory: web/${{ matrix.app }}
      - run: npm run test:policy
        working-directory: web/${{ matrix.app }}
      - run: npm run build
        working-directory: web/${{ matrix.app }}
      - name: Install accessibility tooling
        if: matrix.app == 'admin'
        run: npm ci
      - name: Install Chromium for accessibility audit
        if: matrix.app == 'admin'
        run: npx playwright install --with-deps chromium
      - name: Build Client for accessibility audit
        if: matrix.app == 'admin'
        run: |
          npm ci
          npm run build
        working-directory: web/client
      - name: Run WCAG accessibility audit
        if: matrix.app == 'admin'
        run: npm run test:accessibility

  release-metadata:
    runs-on: ubuntu-latest
    needs: [go, web]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - run: ruby scripts/validate-openapi.rb
      - run: ruby scripts/generate-sbom.rb

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: ruby scripts/secret-scan.rb
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
        working-directory: server
      - run: govulncheck ./...
        working-directory: client
      - run: go install github.com/securego/gosec/v2/cmd/gosec@latest
      - run: gosec -fmt sarif -out gosec-server.sarif ./...
        working-directory: server
      - run: gosec -fmt sarif -out gosec-client.sarif ./...
        working-directory: client
      - name: Upload server gosec report
        if: ${{ always() && hashFiles('server/gosec-server.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: server/gosec-server.sarif
          category: gosec-server
      - name: Upload client gosec report
        if: ${{ always() && hashFiles('client/gosec-client.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: client/gosec-client.sarif
          category: gosec-client
      - run: npm ci
        working-directory: web/admin
      - run: npm audit --audit-level=high
        working-directory: web/admin
      - run: npm ci
        working-directory: web/client
      - run: npm audit --audit-level=high
        working-directory: web/client
      - name: Filesystem dependency and secret scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

  container-scan:
    runs-on: ubuntu-latest
    needs: [go, web]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Build Server image
        run: docker build --file docker/server.Dockerfile --tag frp-panel-server:ci .
      - name: Build Client image
        run: docker build --file docker/client.Dockerfile --tag frp-panel-client:ci .
      - name: Scan Server image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: frp-panel-server:ci
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Scan Client image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: frp-panel-client:ci
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - run: go test -run=^$ -fuzz=FuzzNormalizeDomain -fuzztime=30s ./internal/service
        working-directory: server
      - run: go test -run=^$ -fuzz=FuzzSnapshotRoundTrip -fuzztime=30s ./internal/router
        working-directory: server
      - run: go test -run=^$ -fuzz=FuzzNormalizeServerURL -fuzztime=30s ./internal/security
        working-directory: client
