name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [server, client]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - run: go test -race ./...
        working-directory: ${{ matrix.module }}
      - run: go vet ./...
        working-directory: ${{ matrix.module }}
      - run: go install honnef.co/go/tools/cmd/staticcheck@latest
      - run: staticcheck ./...
        working-directory: ${{ matrix.module }}
      - run: ./scripts/check-format.sh
        if: matrix.module == 'server'

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: server/go.sum
      - run: ruby scripts/validate-openapi.rb

  web:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [admin, client]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: web/${{ matrix.app }}/package-lock.json
      - run: npm ci
        working-directory: web/${{ matrix.app }}
      - run: npm run typecheck
        working-directory: web/${{ matrix.app }}
      - run: npm run build
        working-directory: web/${{ matrix.app }}

  release-metadata:
    runs-on: ubuntu-latest
    needs: [go, web]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - run: ruby scripts/validate-openapi.rb
      - run: ruby scripts/generate-sbom.rb

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: ruby scripts/secret-scan.rb
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
        working-directory: server
      - run: govulncheck ./...
        working-directory: client
      - run: npm ci
        working-directory: web/admin
      - run: npm audit --audit-level=high
        working-directory: web/admin
      - run: npm ci
        working-directory: web/client
      - run: npm audit --audit-level=high
        working-directory: web/client

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - run: go test -run=^$ -fuzz=FuzzNormalizeDomain -fuzztime=30s ./internal/service
        working-directory: server
      - run: go test -run=^$ -fuzz=FuzzSnapshotRoundTrip -fuzztime=30s ./internal/router
        working-directory: server
      - run: go test -run=^$ -fuzz=FuzzNormalizeServerURL -fuzztime=30s ./internal/security
        working-directory: client
