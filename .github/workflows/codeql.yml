name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  go:
    name: Analyze Go (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [server, client]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - uses: github/codeql-action/init@v4
        with:
          languages: go
          build-mode: manual
      - run: go build ./...
        working-directory: ${{ matrix.module }}
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:go/module:${{ matrix.module }}

  typescript:
    name: Analyze TypeScript (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [admin, client]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: web/${{ matrix.app }}/package-lock.json
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
      - run: npm ci
        working-directory: web/${{ matrix.app }}
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript/app:${{ matrix.app }}
